<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playbook Flashcards</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><div class="brand">PLAYBOOK <b>FLASHCARDS</b></div><p>Learn the formation. Know the call.</p></header>
<section class="direction" aria-label="Study direction"><span>STUDY DIRECTION</span><button class="active" data-mode="diagram">Diagram to Answer</button><button data-mode="answer">Answer to Diagram</button></section>
<section class="toolbar"><div id="filters"><button class="active" data-filter="all">All cards</button><button data-filter="play">Plays</button><button data-filter="formation">Formations</button></div><button id="shuffle">Shuffle deck</button></section>
<section class="study"><div class="meta"><span id="kind"></span><span id="progress"></span></div><button id="card" class="card" aria-label="Flip flashcard"><span class="inside"><span class="face front"><span>What is this <b id="question-kind"></b>?</span><img id="diagram" alt="Football diagram"><small id="front-tip">Tap to reveal the answer</small></span><span class="face back"><small>THE ANSWER</small><strong id="answer"></strong><em id="answer-kind"></em><i id="back-tip">Tap to see the diagram again</i></span></span></button><div class="controls"><button id="previous">Previous</button><button id="flip" class="primary">Show answer</button><button id="next">Next</button></div><p class="tip">Use left/right arrows to change cards. Press space to flip.</p></section></main><script src="app.js"></script></body></html>
